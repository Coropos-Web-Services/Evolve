[project]
name = "echodesk-agent"
version = "0.1.0"
description = "EchoDesk agent - Runs on nodes to report metrics and execute commands"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0.1",
    "python-socketio[client]>=5.11.0",
]

[project.optional-dependencies]
docker = [
    "docker>=7.0.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "black>=23.12.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]
